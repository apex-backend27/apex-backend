<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX - Redirección</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid #e0e0e0;
        }
        .container h1 { font-size: 32px; font-weight: 800; color: #000; }
        .container .slogan { font-size: 9px; color: #999; letter-spacing: 4px; text-transform: uppercase; margin-top: -4px; margin-bottom: 24px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #000; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .mensaje { font-size: 14px; color: #666; margin-top: 16px; }
        .btn { display: inline-block; margin-top: 16px; background: #000; color: #fff; padding: 12px 32px; border-radius: 12px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; }
        .btn:hover { background: #333; }
        body.dark-mode { background: #121212; }
        body.dark-mode .container { background: #1e1e1e; border-color: #333; }
        body.dark-mode .container h1 { color: #e0e0e0; }
        body.dark-mode .mensaje { color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <h1>APEX</h1>
        <div class="slogan">CRECE · GANA · TRIUNFA</div>
        <div class="loader"></div>
        <div class="mensaje" id="mensaje">Redirigiendo...</div>
        <a href="../index.html" class="btn">Ir al Inicio</a>
    </div>

    <script>
        (function() {
            if (localStorage.getItem('apex_dark_mode') === 'true') {
                document.body.classList.add('dark-mode');
            }
        })();

        var path = window.location.pathname;
        var codigo = path.split('/').pop();
        
        if (codigo && codigo !== 'index.html') {
            var usuarios = JSON.parse(localStorage.getItem('apex_users') || '[]');
            var usuarioEncontrado = null;
            
            for (var i = 0; i < usuarios.length; i++) {
                if (usuarios[i].codigo_referido === codigo) {
                    usuarioEncontrado = usuarios[i];
                    break;
                }
            }
            
            if (usuarioEncontrado) {
                document.getElementById('mensaje').textContent = '👋 Bienvenido, serás referido por ' + usuarioEncontrado.nombre + ' ' + (usuarioEncontrado.apellido || '');
                localStorage.setItem('apex_ref_codigo', codigo);
                setTimeout(function() {
                    window.location.href = '../index.html?ref=' + codigo;
                }, 2000);
            } else {
                document.getElementById('mensaje').textContent = '⚠️ Código de referido no válido';
                setTimeout(function() {
                    window.location.href = '../index.html';
                }, 3000);
            }
        } else {
            document.getElementById('mensaje').textContent = '⚠️ Código de referido no proporcionado';
            setTimeout(function() {
                window.location.href = '../index.html';
            }, 3000);
        }
    </script>
</body>
</html>
