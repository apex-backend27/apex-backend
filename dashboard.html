<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX - Dashboard</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 16px; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { padding: 8px 16px; background: #dc3545; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
        .card { background: #f8f9fa; padding: 16px; border-radius: 12px; margin-bottom: 12px; }
        .card .label { font-size: 12px; color: #666; }
        .card .value { font-size: 20px; font-weight: 600; }
        .error { color: #dc3545; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏠 Dashboard</h1>
        <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
    </div>
    <div id="loading">Cargando datos...</div>
    <div id="content" style="display:none;">
        <div class="card"><div class="label">👤 Usuario</div><div class="value" id="userName">-</div></div>
        <div class="card"><div class="label">💰 Saldo</div><div class="value" id="userBalance">$0.00</div></div>
        <div class="card"><div class="label">🔑 Código Referido</div><div class="value" id="userReferral">-</div></div>
        <div class="card"><div class="label">📱 Teléfono</div><div class="value" id="userPhone">-</div></div>
    </div>
    <div id="error" class="error" style="display:none;">Error al cargar datos</div>
</div>

<script>
const API_URL = 'https://apex-backend-cj21.onrender.com';

function logout() {
    localStorage.removeItem('apex_token');
    localStorage.removeItem('apex_user');
    window.location.href = 'index.html';
}

function loadDashboard() {
    const token = localStorage.getItem('apex_token');
    console.log('🔍 Token:', token ? '✅ Existe' : '❌ No existe');
    
    if (!token) {
        window.location.href = 'index.html';
        return;
    }

    fetch(API_URL + '/api/verify', {
        method: 'GET',
        headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(response => {
        console.log('📥 Status:', response.status);
        return response.json();
    })
    .then(data => {
        console.log('📦 Datos:', data);
        if (data.error) {
            document.getElementById('error').textContent = '❌ ' + data.error;
            document.getElementById('error').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
            setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            return;
        }
        if (data.user) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            document.getElementById('userName').textContent = data.user.nombre + ' ' + (data.user.apellido || '');
            document.getElementById('userBalance').textContent = '$' + (data.user.balance || 0).toFixed(2);
            document.getElementById('userReferral').textContent = data.user.codigo_referido || '-';
            document.getElementById('userPhone').textContent = data.user.telefono || '-';
        }
    })
    .catch(error => {
        console.error('❌ Error:', error);
        document.getElementById('error').textContent = '❌ ' + error.message;
        document.getElementById('error').style.display = 'block';
        document.getElementById('loading').style.display = 'none';
        setTimeout(() => { window.location.href = 'index.html'; }, 2000);
    });
}

loadDashboard();
</script>
</body>
</html>
